<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League of Gentlemen (#152084) — History Vault</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --border: #334155;
    --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8;
    --win: #22c55e; --loss: #ef4444; --gold: #eab308;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
  .container { max-width: 1150px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.7rem; color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input, button { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.95rem; }
  input { background: var(--card); color: var(--text); width: 110px; }
  button { background: var(--accent); color: #0f172a; font-weight: 700; cursor: pointer; border: none; }
  button:hover { opacity: 0.9; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .tab { background: var(--card); color: var(--muted); padding: 12px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; border: 1px solid var(--border); }
  .tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
  .panel { display: none; background: var(--card); padding: 22px; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
  .panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95rem; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--accent); white-space: nowrap; }
  tr:hover { background: rgba(255,255,255,0.04); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
  .stat-card { background: var(--bg); padding: 18px; border-radius: 10px; border: 1px solid var(--border); }
  .stat-card h3 { margin: 0 0 8px 0; font-size: 0.85rem; text-transform: uppercase; color: var(--muted); }
  .stat-card .val { font-size: 1.5rem; font-weight: 800; color: var(--gold); }
  .stat-card .sub { font-size: 0.9rem; color: var(--text); margin-top: 6px; }
  .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: 700; }
  .win { background: rgba(34,197,94,0.2); color: var(--win); }
  .loss { background: rgba(239,68,68,0.2); color: var(--loss); }
  #status { margin: 12px 0; padding: 14px; background: rgba(234,179,8,0.15); border: 1px solid var(--gold); border-radius: 8px; color: var(--gold); font-weight: 700; font-size: 0.95rem; }
  .alias-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1 id="leagueTitle">🏈 League of Gentlemen (#152084)</h1>
      <div style="color:var(--muted); font-size:0.9rem;">All-Time Fleaflicker Stats, Records & Matchup History</div>
    </div>
    <div class="controls">
      <input type="text" id="leagueId" value="152084">
      <input type="number" id="startYear" value="2014">
      <input type="number" id="endYear" value="2026">
      <button id="loadBtn" type="button">Refresh Stats</button>
    </div>
  </header>

  <div id="status">⏳ Page loaded! Starting connection to Fleaflicker...</div>

  <div class="tabs">
    <div class="tab active" data-tab="standings">🏆 All-Time Wins & Losses</div>
    <div class="tab" data-tab="luck">🍀 Luck Rating</div>
    <div class="tab" data-tab="h2h">⚔️ Head-to-Head Record</div>
    <div class="tab" data-tab="records">📜 Fun Record Book</div>
    <div class="tab" data-tab="seasons">📅 Past Champions</div>
    <div class="tab" data-tab="drafts">🎓 1st Round Draft Picks</div>
    <div class="tab" data-tab="aliases">👤 Fix Manager Names</div>
  </div>

  <div id="standings" class="panel active"></div>
  <div id="luck" class="panel"></div>
  <div id="h2h" class="panel"></div>
  <div id="records" class="panel"></div>
  <div id="seasons" class="panel"></div>
  <div id="drafts" class="panel"></div>
  <div id="aliases" class="panel"></div>
</div>

<script>
var API_BASE = "https://fleaflicker.com";
var RAW_GAMES = [];
var RAW_SEASONS = [];
var RAW_DRAFTS = [];
var ALIASES = {};

try {
  ALIASES = JSON.parse(localStorage.getItem("ff_aliases_152084") || "{}");
} catch (e) {
  ALIASES = {};
}

function setStatus(msg) {
  var el = document.getElementById("status");
  if (el) el.innerText = msg;
}

var tabButtons = document.querySelectorAll(".tab");
for (var t = 0; t < tabButtons.length; t++) {
  tabButtons[t].addEventListener("click", function() {
    var allTabs = document.querySelectorAll(".tab");
    var allPanels = document.querySelectorAll(".panel");
    for (var i = 0; i < allTabs.length; i++) allTabs[i].classList.remove("active");
    for (var j = 0; j < allPanels.length; j++) allPanels[j].classList.remove("active");
    this.classList.add("active");
    var targetId = this.getAttribute("data-tab");
    document.getElementById(targetId).classList.add("active");
  });
}

document.getElementById("loadBtn").addEventListener("click", function() {
  loadLeagueData();
});

function getManagerName(team) {
  if (!team) return "Unknown";
  var raw = team.name || "Unknown";
  if (team.owners && team.owners.length > 0 && team.owners[0].displayName) {
    raw = team.owners[0].displayName;
  }
  return ALIASES[raw] || raw;
}

async function fetchWithTimeout(url, ms) {
  var controller = new AbortController();
  var timer = setTimeout(function() { controller.abort(); }, ms);
  try {
    var res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    return res;
  } catch (e) {
    clearTimeout(timer);
    return null;
  }
}

async function fetchFleaflicker(endpoint) {
  var target = API_BASE + "/" + endpoint;
  var proxies = [
    "https://corsproxy.io" + encodeURIComponent(target),
    "https://allorigins.win" + encodeURIComponent(target),
    target
  ];

  for (var i = 0; i < proxies.length; i++) {
    var res = await fetchWithTimeout(proxies[i], 4500);
    if (res && res.ok) {
      try {
        var data = await res.json();
        if (data) return data;
      } catch (e) {}
    }
  }
  return null;
}

async function loadLeagueData() {
  var leagueId = document.getElementById("leagueId").value.trim().replace(/\D/g, "") || "152084";
  var startYear = parseInt(document.getElementById("startYear").value, 10) || 2014;
  var endYear = parseInt(document.getElementById("endYear").value, 10) || 2026;

  setStatus("⏳ Connecting to Fleaflicker for League #" + leagueId + "...");
  RAW_GAMES = [];
  RAW_SEASONS = [];
  RAW_DRAFTS = [];

  for (var yr = startYear; yr <= endYear; yr++) {
    setStatus("⏳ Loading " + yr + " season (" + (yr - startYear + 1) + " of " + (endYear - startYear + 1) + ")...");
    var standings = await fetchFleaflicker("FetchLeagueStandings?sport=NFL&league_id=" + leagueId + "&season=" + yr);
    if (!standings || !standings.divisions) continue;

    if (standings.league && standings.league.name) {
      document.getElementById("leagueTitle").innerText = "🏈 " + standings.league.name + " (#" + leagueId + ")";
      document.title = standings.league.name + " — History Vault";
    }

    var teams = [];
    for (var d = 0; d < standings.divisions.length; d++) {
      var div = standings.divisions[d];
      if (div.teams) {
        for (var tm = 0; tm < div.teams.length; tm++) {
          teams.push(div.teams[tm]);
        }
      }
    }
    RAW_SEASONS.push({ year: yr, teams: teams });

    for (var batchStart = 1; batchStart <= 18; batchStart += 4) {
      var promises = [];
      for (var wk = batchStart; wk < batchStart + 4 && wk <= 18; wk++) {
        (function(weekNum) {
          promises.push(
            fetchFleaflicker("FetchLeagueScoreboard?sport=NFL&league_id=" + leagueId + "&season=" + yr + "&scoring_period=" + weekNum)
              .then(function(sb) { return { wk: weekNum, sb: sb }; })
          );
        })(wk);
      }
      var results = await Promise.all(promises);
      var anyGamesInBatch = false;
      for (var r = 0; r < results.length; r++) {
        var sb = results[r].sb;
        if (sb && sb.games && sb.games.length > 0) {
          anyGamesInBatch = true;
          for (var gIdx = 0; gIdx < sb.games.length; gIdx++) {
            var g = sb.games[gIdx];
            var hScore = (g.homeScore && g.homeScore.score && g.homeScore.score.value) ? g.homeScore.score.value : 0;
            var aScore = (g.awayScore && g.awayScore.score && g.awayScore.score.value) ? g.awayScore.score.value : 0;
            if (g.home && g.away && (hScore > 0 || aScore > 0)) {
              RAW_GAMES.push({
                year: yr,
                week: results[r].wk,
                home: g.home,
                away: g.away,
                homePts: hScore,
                awayPts: aScore
              });
            }
          }
        }
      }
      if (!anyGamesInBatch && batchStart > 14) break;
    }

    var draft = await fetchFleaflicker("FetchLeagueDraftBoard?sport=NFL&league_id=" + leagueId + "&season=" + yr);
    if (draft && draft.rows) {
      RAW_DRAFTS.push({ year: yr, rows: draft.rows });
    }

    renderAll();
  }

  if (RAW_SEASONS.length === 0) {
    setStatus("❌ Proxy timed out reaching Fleaflicker. Let me know and we will bake your data directly into the file!");
    return;
  }

  setStatus("✅ Finished! Loaded " + RAW_SEASONS.length + " seasons and " + RAW_GAMES.length + " matchups for League of Gentlemen!");
  renderAll();
}

function renderAll() {
  renderStandingsAndLuck();
  renderRecords();
