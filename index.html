<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League #152084 History Vault</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --border: #334155;
    --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8;
    --win: #22c55e; --loss: #ef4444; --gold: #eab308;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
  .container { max-width: 1150px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.7rem; color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input, button { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.95rem; }
  input { background: var(--card); color: var(--text); width: 115px; }
  button { background: var(--accent); color: #0f172a; font-weight: 700; cursor: pointer; border: none; }
  button:hover { opacity: 0.9; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .tab { background: var(--card); color: var(--muted); padding: 12px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; border: 1px solid var(--border); }
  .tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
  .panel { display: none; background: var(--card); padding: 22px; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
  .panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95rem; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--accent); white-space: nowrap; }
  tr:hover { background: rgba(255,255,255,0.04); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
  .stat-card { background: var(--bg); padding: 18px; border-radius: 10px; border: 1px solid var(--border); }
  .stat-card h3 { margin: 0 0 8px 0; font-size: 0.85rem; text-transform: uppercase; color: var(--muted); }
  .stat-card .val { font-size: 1.5rem; font-weight: 800; color: var(--gold); }
  .stat-card .sub { font-size: 0.9rem; color: var(--text); margin-top: 6px; }
  .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: 700; }
  .win { background: rgba(34,197,94,0.2); color: var(--win); }
  .loss { background: rgba(239,68,68,0.2); color: var(--loss); }
  #status { margin: 12px 0; padding: 12px; background: rgba(234,179,8,0.12); border: 1px solid var(--gold); border-radius: 8px; color: var(--gold); font-weight: 700; font-size: 0.95rem; }
  .alias-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1 id="leagueTitle">🏈 League #152084 History Vault</h1>
      <div style="color:var(--muted); font-size:0.9rem;">All-Time Fleaflicker Stats, Records & Matchup History</div>
    </div>
    <div class="controls">
      <input type="text" id="leagueId" value="152084">
      <input type="number" id="startYear" value="2014">
      <input type="number" id="endYear" value="2026">
      <button id="loadBtn" type="button" onclick="loadLeagueData()">Refresh Stats</button>
    </div>
  </header>

  <div id="status">Starting up...</div>

  <div class="tabs">
    <div class="tab active" onclick="openTab(this, 'standings')">🏆 All-Time Wins & Losses</div>
    <div class="tab" onclick="openTab(this, 'luck')">🍀 Luck Rating</div>
    <div class="tab" onclick="openTab(this, 'h2h')">⚔️ Head-to-Head Record</div>
    <div class="tab" onclick="openTab(this, 'records')">📜 Fun Record Book</div>
    <div class="tab" onclick="openTab(this, 'seasons')">📅 Past Champions</div>
    <div class="tab" onclick="openTab(this, 'drafts')">🎓 1st Round Draft Picks</div>
    <div class="tab" onclick="openTab(this, 'aliases')">👤 Fix Manager Names</div>
  </div>

  <div id="standings" class="panel active"></div>
  <div id="luck" class="panel"></div>
  <div id="h2h" class="panel"></div>
  <div id="records" class="panel"></div>
  <div id="seasons" class="panel"></div>
  <div id="drafts" class="panel"></div>
  <div id="aliases" class="panel"></div>
</div>

<script>
var DEFAULT_LEAGUE_ID = "152084";
var DEFAULT_START_YEAR = 2014;
var DEFAULT_END_YEAR = 2026;
var API_BASE = "https://fleaflicker.com";

var RAW_GAMES = [];
var RAW_SEASONS = [];
var RAW_DRAFTS = [];
var ALIASES = {};
try {
  ALIASES = JSON.parse(localStorage.getItem("ff_aliases_152084") || "{}");
} catch (e) {
  ALIASES = {};
}

function openTab(el, tabId) {
  var tabs = document.querySelectorAll(".tab");
  var panels = document.querySelectorAll(".panel");
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
  for (var j = 0; j < panels.length; j++) panels[j].classList.remove("active");
  el.classList.add("active");
  document.getElementById(tabId).classList.add("active");
}

function getManagerName(team) {
  if (!team) return "Unknown";
  var raw = team.name || "Unknown";
  if (team.owners && team.owners.length > 0 && team.owners.displayName) {
    raw = team.owners.displayName;
  }
  return ALIASES[raw] || raw;
}

async function fetchJson(endpoint) {
  var directUrl = API_BASE + "/" + endpoint;
  var proxies = [
    directUrl,
    "https://corsproxy.io?" + encodeURIComponent(directUrl),
    "https://allorigins.win" + encodeURIComponent(directUrl)
  ];

  for (var i = 0; i < proxies.length; i++) {
    try {
      var res = await fetch(proxies[i]);
      if (res.ok) {
        var data = await res.json();
        if (data) return data;
      }
    } catch (err) {
      // Try next proxy
    }
  }
  return null;
}

async function loadLeagueData() {
  var status = document.getElementById("status");
  var leagueId = document.getElementById("leagueId").value.trim().replace(/\D/g, "") || DEFAULT_LEAGUE_ID;
  var startYear = parseInt(document.getElementById("startYear").value, 10) || DEFAULT_START_YEAR;
  var endYear = parseInt(document.getElementById("endYear").value, 10) || DEFAULT_END_YEAR;

  status.innerText = "⏳ Connecting to Fleaflicker for League #" + leagueId + "...";
  RAW_GAMES = [];
  RAW_SEASONS = [];
  RAW_DRAFTS = [];

  for (var yr = startYear; yr <= endYear; yr++) {
    status.innerText = "⏳ Grabbing " + yr + " season (standings, all 18 weeks & draft)...";
    var standings = await fetchJson("FetchLeagueStandings?sport=NFL&league_id=" + leagueId + "&season=" + yr);
    if (!standings || !standings.divisions) continue;

    if (standings.league && standings.league.name) {
      document.getElementById("leagueTitle").innerText = "🏈 " + standings.league.name;
      document.title = standings.league.name + " — History Vault";
    }

    var teams = [];
    standings.divisions.forEach(function(d) {
      if (d.teams) {
        d.teams.forEach(function(t) { teams.push(t); });
      }
    });
    RAW_SEASONS.push({ year: yr, teams: teams });

    var weekPromises = [];
    for (var wk = 1; wk <= 18; wk++) {
      (function(weekNum) {
        weekPromises.push(
          fetchJson("FetchLeagueScoreboard?sport=NFL&league_id=" + leagueId + "&season=" + yr + "&scoring_period=" + weekNum)
            .then(function(sb) { return { wk: weekNum, sb: sb }; })
        );
      })(wk);
    }

    var weekResults = await Promise.all(weekPromises);
    weekResults.forEach(function(item) {
      var sb = item.sb;
      if (sb && sb.games) {
        sb.games.forEach(function(g) {
          var hScore = (g.homeScore && g.homeScore.score && g.homeScore.score.value) ? g.homeScore.score.value : 0;
          var aScore = (g.awayScore && g.awayScore.score && g.awayScore.score.value) ? g.awayScore.score.value : 0;
          if (g.home && g.away && (hScore > 0 || aScore > 0)) {
            RAW_GAMES.push({
              year: yr,
              week: item.wk,
              home: g.home,
              away: g.away,
              homePts: hScore,
              awayPts: aScore
            });
          }
        });
      }
    });

    var draft = await fetchJson("FetchLeagueDraftBoard?sport=NFL&league_id=" + leagueId + "&season=" + yr);
    if (draft && draft.rows) {
      RAW_DRAFTS.push({ year: yr, rows: draft.rows });
    }
  }

  if (RAW_SEASONS.length === 0) {
    status.innerText = "❌ Fleaflicker returned no data for League #" + leagueId + ". Check that your league is set to Public in Fleaflicker Settings.";
    return;
  }

  status.innerText = "✅ Loaded " + RAW_SEASONS.length + " seasons and " + RAW_GAMES.length + " matchups for League #" + leagueId + "!";
  renderAll();
}

function renderAll() {
  renderStandingsAndLuck();
  renderRecords();
  renderH2H();
  renderSeasons();
  renderDrafts();
  renderAliases();
}

function renderStandingsAndLuck() {
  var stats = {};
  function initMgr(m) {
    if (!stats[m]) {
      stats[m] = { name: m, w: 0, l: 0, t: 0, pf: 0, pa: 0, allPlayW: 0, allPlayL: 0, titles: 0, seasons: 0 };
    }
  }

  RAW_SEASONS.forEach(function(s) {
    s.teams.forEach(function(t) {
      var m = getManagerName(t);
      initMgr(m);
      stats[m].seasons++;
      if (t.rankOverall === 1) stats[m].titles++;
    });
  });

  var weekBuckets = {};
  RAW_GAMES.forEach(function(g) {
    var key = g.year + "-" + g.week;
    if (!weekBuckets[key]) weekBuckets[key] = [];
    var hMgr = getManagerName(g.home);
    var aMgr = getManagerName(g.away);
    initMgr(hMgr);
    initMgr(aMgr);

    stats[hMgr].pf += g.homePts;
    stats[hMgr].pa += g.awayPts;
    stats[aMgr].pf += g.awayPts;
    stats[aMgr].pa += g.homePts;

    if (g.homePts > g.awayPts) { stats[hMgr].w++; stats[aMgr].l++; }
