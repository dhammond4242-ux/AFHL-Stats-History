<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League of Gentlemen (#152084) — History Vault</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --border: #334155;
    --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8;
    --win: #22c55e; --loss: #ef4444; --gold: #eab308;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
  .container { max-width: 1150px; margin: 0 auto; }
  header { border-bottom: 2px solid var(--border); padding-bottom: 18px; margin-bottom: 20px; }
  h1 { margin: 0 0 6px 0; font-size: 1.8rem; color: var(--accent); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .tab { background: var(--card); color: var(--muted); padding: 12px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; border: 1px solid var(--border); }
  .tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
  .panel { display: none; background: var(--card); padding: 22px; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
  .panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95rem; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--accent); white-space: nowrap; }
  tr:hover { background: rgba(255,255,255,0.04); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
  .stat-card { background: var(--bg); padding: 18px; border-radius: 10px; border: 1px solid var(--border); }
  .stat-card h3 { margin: 0 0 8px 0; font-size: 0.85rem; text-transform: uppercase; color: var(--muted); }
  .stat-card .val { font-size: 1.5rem; font-weight: 800; color: var(--gold); }
  .stat-card .sub { font-size: 0.9rem; color: var(--text); margin-top: 6px; }
  .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: 700; }
  .win { background: rgba(34,197,94,0.2); color: var(--win); }
  .loss { background: rgba(239,68,68,0.2); color: var(--loss); }
  .alias-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
  input { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 id="leagueTitle">🏈 League History Vault</h1>
    <div id="subtitle" style="color:var(--muted); font-size:0.95rem;">Loading compiled league history...</div>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="openTab(this, 'standings')">🏆 All-Time Wins & Losses</div>
    <div class="tab" onclick="openTab(this, 'luck')">🍀 Luck Rating</div>
    <div class="tab" onclick="openTab(this, 'h2h')">⚔️ Head-to-Head Record</div>
    <div class="tab" onclick="openTab(this, 'records')">📜 Fun Record Book</div>
    <div class="tab" onclick="openTab(this, 'seasons')">📅 Past Champions</div>
    <div class="tab" onclick="openTab(this, 'drafts')">🎓 1st Round Draft Picks</div>
    <div class="tab" onclick="openTab(this, 'aliases')">👤 Fix Manager Names</div>
  </div>

  <div id="standings" class="panel active"></div>
  <div id="luck" class="panel"></div>
  <div id="h2h" class="panel"></div>
  <div id="records" class="panel"></div>
  <div id="seasons" class="panel"></div>
  <div id="drafts" class="panel"></div>
  <div id="aliases" class="panel"></div>
</div>

<script>
let DATA = null;
let ALIASES = JSON.parse(localStorage.getItem("ff_aliases_152084") || "{}");

function openTab(el, id) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  el.classList.add("active");
  document.getElementById(id).classList.add("active");
}

function mgr(name) {
  return ALIASES[name] || name;
}

fetch("data.json?v=" + Date.now())
  .then(r => r.json())
  .then(json => {
    DATA = json;
    document.getElementById("leagueTitle").innerText = "🏈 " + json.leagueName + " (#" + json.leagueId + ")";
    document.getElementById("subtitle").innerText = json.seasons.length + " Seasons • " + json.games.length + " Total Matchups • Auto-Synced from Fleaflicker";
    renderAll();
  })
  .catch(() => {
    document.getElementById("subtitle").innerText = "❌ Could not find data.json yet. Run the 'Sync Fleaflicker Stats' workflow in your GitHub Actions tab first!";
  });

function renderAll() {
  renderStandingsAndLuck();
  renderH2H();
  renderRecords();
  renderSeasons();
  renderDrafts();
  renderAliases();
}

function renderStandingsAndLuck() {
  const stats = {};
  const init = m => { if (!stats[m]) stats[m] = { name: m, w: 0, l: 0, t: 0, pf: 0, pa: 0, apW: 0, apL: 0, titles: 0, seasons: 0 }; };

  DATA.seasons.forEach(s => {
    s.teams.forEach(tm => {
      const m = mgr(tm.owner);
      init(m);
      stats[m].seasons++;
      if (tm.rank === 1) stats[m].titles++;
    });
  });

  const weeks = {};
  DATA.games.forEach(g => {
    const k = g.year + "-" + g.week;
    if (!weeks[k]) weeks[k] = [];
    const h = mgr(g.home), a = mgr(g.away);
    init(h); init(a);
    stats[h].pf += g.homePts; stats[h].pa += g.awayPts;
    stats[a].pf += g.awayPts; stats[a].pa += g.homePts;
    if (g.homePts > g.awayPts) { stats[h].w++; stats[a].l++; }
    else if (g.awayPts > g.homePts) { stats[a].w++; stats[h].l++; }
    else { stats[h].t++; stats[a].t++; }
    weeks[k].push({ m: h, p: g.homePts }, { m: a, p: g.awayPts });
  });

  Object.values(weeks).forEach(list => {
    list.forEach(x => list.forEach(y => {
      if (x.m !== y.m) {
        if (x.p > y.p) stats[x.m].apW++;
        else if (x.p < y.p) stats[x.m].apL++;
      }
    }));
  });

  const rows = Object.values(stats).sort((a, b) => (b.w / (b.w + b.l || 1)) - (a.w / (a.w + a.l || 1)));

  let html = "<h2>All-Time Wins, Losses & Points</h2><table><thead><tr><th>Manager</th><th>Seasons</th><th>Titles</th><th>Wins</th><th>Losses</th><th>Win %</th><th>Total Points</th><th>Avg PPG</th></tr></thead><tbody>";
  rows.forEach(r => {
    const gp = r.w + r.l + r.t || 1;
    html += `<tr><td><strong>${r.name}</strong></td><td>${r.seasons}</td><td>${r.titles ? "🏆".repeat(r.titles) : "-"}</td>
      <td><span class="badge win">${r.w}</span></td><td><span class="badge loss">${r.l}</span></td>
      <td>${((r.w / gp) * 100).toFixed(1)}%</td><td>${r.pf.toFixed(1)}</td><td>${(r.pf / gp).toFixed(1)}</td></tr>`;
  });
  document.getElementById("standings").innerHTML = html + "</tbody></table>";

  const luck = rows.map(r => {
    const act = r.w / (r.w + r.l || 1);
    const ap = r.apW / (r.apW + r.apL || 1);
    return { ...r, act, ap, score: (act - ap) * 100 };
  }).sort((a, b) => b.score - a.score);

  let lHtml = "<h2>Luck Rating (Schedule Luck)</h2><p style='color:var(--muted);'>Green (+%) means easy schedule luck. Red (-%) means tough schedule luck.</p><table><thead><tr><th>Manager</th><th>Real Win %</th><th>All-Play Record</th><th>Luck Rating</th></tr></thead><tbody>";
  luck.forEach(r => {
    const badge = r.score >= 0 ? `<span class="badge win">+${r.score.toFixed(1)}% Lucky</span>` : `<span class="badge loss">${r.score.toFixed(1)}% Unlucky</span>`;
    lHtml += `<tr><td><strong>${r.name}</strong></td><td>${(r.act * 100).toFixed(1)}%</td><td>${r.apW}-${r.apL} (${(r.ap * 100).toFixed(1)}%)</td><td>${badge}</td></tr>`;
  });
  document.getElementById("luck").innerHTML = lHtml + "</tbody></table>";
}

function renderH2H() {
  const managers = [...new Set(DATA.games.flatMap(g => [mgr(g.home), mgr(g.away)]))].sort();
  const mat = {};
  managers.forEach(a => { mat[a] = {}; managers.forEach(b => mat[a][b] = { w: 0, l: 0 }); });
  DATA.games.forEach(g => {
    const h = mgr(g.home), a = mgr(g.away);
    if (g.homePts > g.awayPts) { mat[h][a].w++; mat[a][h].l++; }
    else if (g.awayPts > g.homePts) { mat[a][h].w++; mat[h][a].l++; }
  });
  let html = "<h2>Head-to-Head Record</h2><table><thead><tr><th>Manager</th>" + managers.map(m => `<th>${m}</th>`).join("") + "</tr></thead><tbody>";
  managers.forEach(a => {
    html += `<tr><td><strong>${a}</strong></td>` + managers.map(b => {
      if (a === b) return "<td style='color:var(--muted)'>—</td>";
      const r = mat[a][b];
      const cls = r.w > r.l ? "win" : (r.w < r.l ? "loss" : "");
      return `<td><span class="badge ${cls}">${r.w}-${r.l}</span></td>`;
    }).join("") + "</tr>";
  });
  document.getElementById("h2h").innerHTML = html + "</tbody></table>";
}

function renderRecords() {
  let hi = { pts: -1 }, lo = { pts: 99999 }, blow = { d: -1 }, close = { d: 99999 }, shoot = { t: -1 };
  DATA.games.forEach(g => {
    const h = mgr(g.home), a = mgr(g.away);
    if (g.homePts > hi.pts) hi = { pts: g.homePts, m: h, o: a, y: g.year, w: g.week };
    if (g.awayPts > hi.pts) hi = { pts: g.awayPts, m: a, o: h, y: g.year, w: g.week };
    if (g.homePts < lo.pts) lo = { pts: g.homePts, m: h, o: a, y: g.year, w: g.week };
    if (g.awayPts < lo.pts) lo = { pts: g.awayPts, m: a, o: h, y: g.year, w: g.week };
    const d = Math.abs(g.homePts - g.awayPts);
    const win = g.homePts > g.awayPts ? h : a, los = g.homePts > g.awayPts ? a : h;
    const sc = `${Math.max(g.homePts, g.awayPts).toFixed(2)} - ${Math.min(g.homePts, g.awayPts).toFixed(2)}`;
    if (d > blow.d) blow = { d, win, los, sc, y: g.year, w: g.week };
    if (d > 0 && d < close.d) close = { d, win, los, sc, y: g.year, w: g.week };
    if (g.homePts + g.awayPts > shoot.t) shoot = { t: g.homePts + g.awayPts, h, a, sc: `${g.homePts.toFixed(2)} - ${g.awayPts.toFixed(2)}`, y: g.year, w: g.week };
  });
  document.getElementById("records").innerHTML = `<h2>All-Time League Record Book</h2><div class="grid">
